name: Deploy model catalog site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'eng/catalog/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p _site/catalog
          cp -R site/. _site/
          cp eng/catalog/*-models.json _site/catalog/
          # The site loads every manifest listed here, so a new provider manifest shows up without a site change.
          (cd _site/catalog && ls *-models.json | jq -R . | jq -s . > index.json)
          # Fail the build if a manifest isn't valid JSON.
          for f in _site/catalog/*.json; do jq empty "$f"; done
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
